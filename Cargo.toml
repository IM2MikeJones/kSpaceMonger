[package]
name = "kspacemonger"
version = "0.1.0"
edition = "2021"
description = "kSpaceMonger — a fast disk space map for Linux in the classic style"

[[bin]]
name = "kSpaceMonger"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
png = "0.18"
libc = "0.2"

[profile.release]
opt-level = 3

[profile.dev]
opt-level = 2
