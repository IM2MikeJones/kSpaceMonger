[package]
name = "kspacemonger"
version = "1.0.1"
edition = "2021"
description = "kSpaceMonger — a fast disk space map for Linux in the classic style"

[lib]
name = "kspacemonger"
path = "src/lib.rs"

[[bin]]
name = "kSpaceMonger"
path = "src/main.rs"
required-features = ["gui"]

[[bin]]
name = "ksm-agent"
path = "src/bin/ksm_agent.rs"

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:png"]

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"], optional = true }
png = { version = "0.18", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3

[profile.dev]
opt-level = 2
